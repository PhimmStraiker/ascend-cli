[pytest]
# Ascend Bridge v2 regression + permutation suite.
# Everything here runs OFFLINE — HTTP (requests + urllib) and websockets are
# mocked in tests/conftest.py; no sockets are opened.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Quiet, deterministic output. Add -v locally for the full parametrized list.
addopts = -q -ra
filterwarnings =
    ignore::DeprecationWarning
